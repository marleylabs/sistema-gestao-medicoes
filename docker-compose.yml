name: projetocrud-medio

services:
  postgres:
    image: postgres:16-alpine
    container_name: medicoes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medicoes
      POSTGRES_USER: medicoes_app
      POSTGRES_PASSWORD: medicoes_app_dev
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicoes_app -d medicoes"]
      interval: 5s
      timeout: 5s
      retries: 10

  etl:
    build:
      context: .
      dockerfile: Dockerfile.etl
    container_name: medicoes-etl
    environment:
      ETL_DATABASE_URL: postgresql+psycopg://medicoes_app:medicoes_app_dev@postgres:5432/medicoes
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: medicoes-web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://medicoes_app:medicoes_app_dev@postgres:5432/medicoes
      NODE_ENV: production
      ALLOW_DATABASE_RESET: ${ALLOW_DATABASE_RESET:-false}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_BOOTSTRAP_USERNAME: ${AUTH_BOOTSTRAP_USERNAME}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD}
      AUTH_BOOTSTRAP_NAME: ${AUTH_BOOTSTRAP_NAME:-Administrador}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      ETL_SERVER_URL: http://medicoes-etl:4000
      APP_URL: ${APP_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      RESEND_REPLY_TO: ${RESEND_REPLY_TO}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_TEST_MODE: ${EMAIL_TEST_MODE:-true}
      EMAIL_TEST_RECIPIENT: ${EMAIL_TEST_RECIPIENT}
      EMAIL_BM_CC: ${EMAIL_BM_CC}
      EMAIL_FINANCE_CC: ${EMAIL_FINANCE_CC}
      EMAIL_CTA_ENABLED: ${EMAIL_CTA_ENABLED:-false}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      etl:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
